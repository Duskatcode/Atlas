server:
  port: 2333
  address: 0.0.0.0

lavalink:
  pluginsDir: "./plugins"
  server:
    password: "atlas-dev-pass"
    youtubePlaylistLoadLimit: 10
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
  plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID_VR
      - WEB
      - MWEB
      - TVHTML5_SIMPLY

logging:
  level:
    root: INFO
    lavalink: INFO